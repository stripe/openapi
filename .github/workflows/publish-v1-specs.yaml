name: Publish v1 Specs

# Publishes v1 OpenAPI specs for a given API version and cuts a release,
# mirroring pay-server's api-codegen/tools/publish.sh. Specs are pulled from the
# Statics Commander CDN instead of a local build dir.
#
# Only private_preview is implemented. The other modes are reserved so the
# workflow input contract does not need to change when those channels are added.
#
# Triggered by the zoolander LockAndReleasePrivatePreviewSpecs workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 2026-07-08.preview)'
        required: true
        type: string
      mode:
        description: 'Which spec channel to publish'
        required: true
        type: choice
        default: private_preview
        options:
          - private_preview
          - public_preview
          - ga
          - all
      publish_release:
        description: 'Publish to master and create a tag; otherwise push to dry-run/private-preview'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve mode configuration
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          case "$MODE" in
            private_preview)
              {
                echo "CDN_DIR=private_preview"
                echo "SPEC_FILES=spec3.private_preview.sdk.yaml spec3.private_preview.sdk.json"
                echo "FIXTURE_FILES=fixtures3.private_preview.yaml fixtures3.private_preview.json"
                echo "FIXTURE_MSG=Update fixture data for private preview"
                echo "SPEC_MSG=Update OpenAPI specification for private preview"
                echo "TAG_MSG=This release only includes changes to the private preview spec."
                echo "TEST_BRANCH=dry-run/private-preview"
              } >> "$GITHUB_ENV"
              ;;
            public_preview|ga|all)
              echo "::error::Mode '$MODE' is not yet implemented for v1 spec publishing."
              exit 1
              ;;
            *)
              echo "::error::Unknown v1 spec publishing mode: '$MODE'."
              exit 1
              ;;
          esac

      - name: Fetch app installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: gh-api-token
        with:
          app-id: ${{ secrets.GH_APP_STRIPE_OPENAPI_APP_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_OPENAPI_PRIVATE_KEY }}
          # The token checks out this repository and pushes the published specs
          # back to it. Scope defaults to the current repository.
          permission-contents: write

      - name: Checkout openapi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.gh-api-token.outputs.token }}
          # Full history + tags are required so `git describe --tags` can find the
          # last release tag and `git show <tag>:...` can read the prior spec.
          fetch-depth: 0
          fetch-tags: true
          # The final step uses plain `git push`, so retain the narrowly scoped
          # App token. This workflow uploads no artifacts that could contain it.

      - name: Fetch sdk-codegen read token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: sdk-codegen-token
        with:
          app-id: ${{ secrets.GH_APP_STRIPE_OPENAPI_APP_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_OPENAPI_PRIVATE_KEY }}
          owner: stripe
          repositories: sdk-codegen
          permission-contents: read

      - name: Checkout sdk-codegen (provides the diff CLI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stripe/sdk-codegen
          ref: 1b117c3457c094060636cdfc7936e30a86b2e3ca # v17.0.0
          path: sdk-codegen
          token: ${{ steps.sdk-codegen-token.outputs.token }}
          persist-credentials: false

      - name: Setup just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Download specs from CDN
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BASE="https://b.stripecdn.com/api-artifacts/assets/openapi/${VERSION}/${CDN_DIR}"

          # Required specs — fail the job if absent.
          for f in $SPEC_FILES; do
            curl -fsSL "$BASE/$f" -o "openapi/$f"
          done

          # Optional fixtures — skip cleanly if the CDN returns 404.
          for f in $FIXTURE_FILES; do
            if ! curl -fsSL "$BASE/$f" -o "openapi/$f"; then
              echo "Optional file $f absent from CDN; skipping."
              rm -f "openapi/$f"
            fi
          done

      - name: Commit specs, generate diffs, and cut release
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: .github/scripts/publish-v1-specs.sh
