name: Publish v1 Specs

# Compatibility wrapper for scheduled private-preview publishers. New callers
# should dispatch sync-openapi-specs.yml directly.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 2026-07-08.preview)'
        required: true
        type: string
      mode:
        description: 'Which spec channel to publish'
        required: true
        type: choice
        default: private_preview
        options:
          - private_preview
          - public_preview
          - ga
          - all
      publish_release:
        description: 'Publish to master and create a tag; otherwise push a test branch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/sync-openapi-specs.yml
    with:
      version: ${{ inputs.version }}
      mode: ${{ inputs.mode }}
      unified: false
      run_mode: ${{ inputs.publish_release && 'release' || 'test' }}
    secrets: inherit
