name: Test

on:
  pull_request: {}
  push: {}

permissions: {}

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test OpenAPI artifact downloads
        run: .github/scripts/tests/download-openapi-specs_test.sh
