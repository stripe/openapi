name: Sync OpenAPI Canary

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      # Deprecated and ignored: every channel is synced best-effort. Kept until callers stop sending it.
      channel:
        required: false
        type: string
        default: all
      run_mode:
        required: false
        type: string
        default: dry_run
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 2026-07-08.preview)'
        required: true
        type: string
      channel:
        description: 'Deprecated and ignored; every channel is synced best-effort'
        required: false
        type: string
        default: all
      run_mode:
        description: 'Validate only or publish to master'
        required: true
        type: choice
        default: dry_run
        options:
          - dry_run
          - publish

permissions: {}

concurrency:
  # Share a lock with release syncs because both workflows push to master.
  group: sync-openapi-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate inputs
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo "::error::Invalid version name: $VERSION"
            exit 1
          }
          [[ "$RUN_MODE" =~ ^(dry_run|publish)$ ]] || {
            echo "::error::Unknown run mode: $RUN_MODE"
            exit 1
          }

          {
            echo "MODE=all"
            echo "CHANNEL_SLUG=all"
          } >> "$GITHUB_ENV"

      - name: Fetch app installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: gh-api-token
        with:
          app-id: ${{ secrets.GH_APP_STRIPE_OPENAPI_APP_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_OPENAPI_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout openapi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.gh-api-token.outputs.token }}
          ref: master
          fetch-depth: 0

      - name: Download canary specs and fixtures from CDN
        env:
          MODE: ${{ env.MODE }}
          VERSION: ${{ inputs.version }}
        run: .github/scripts/download-openapi-specs.sh "$VERSION" "$MODE" true canary

      - name: Commit and publish canary artifacts
        id: publish
        env:
          CHANNEL: ${{ env.CHANNEL_SLUG }}
          RUN_MODE: ${{ inputs.run_mode }}
          VERSION: ${{ inputs.version }}
        run: .github/scripts/sync-openapi-canary.sh

      - name: Fetch sdk-codegen dispatch token
        if: inputs.run_mode == 'publish'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: sdk-codegen-token
        with:
          app-id: ${{ secrets.GH_APP_STRIPE_OPENAPI_APP_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_OPENAPI_PRIVATE_KEY }}
          owner: stripe
          repositories: sdk-codegen
          permission-actions: write

      - name: Trigger sdk-codegen OpenAPI canary update
        if: inputs.run_mode == 'publish'
        env:
          GH_API_TOKEN: ${{ steps.sdk-codegen-token.outputs.token }}
        run: |
          set -euo pipefail

          curl --fail-with-body \
            -X POST \
            -H "Authorization: token ${GH_API_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/stripe/sdk-codegen/actions/workflows/update-openapi-canary.yml/dispatches \
            --data '{"ref":"master"}'

      - name: Report blocked canary channels
        run: |
          set -euo pipefail

          if [[ -z "${FAILED_CHANNELS:-}" ]]; then
            echo "All canary channels synced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Blocked canary channels"
            echo
            for channel in $FAILED_CHANNELS; do
              echo "- \`${channel}\` kept its previous canary artifacts"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Canary channels blocked: ${FAILED_CHANNELS}. They kept their previous canary artifacts; see the download step for the missing files."
          exit 1
