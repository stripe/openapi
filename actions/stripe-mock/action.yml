name: "stripe-mock"
description: "Starts stripe-mock"

inputs:
  base:
    description: "Base branch"
    required: true
    default: "${{ github.base_ref || github.ref_name }}"
  beta:
    description: "Explicitly use beta"
    required: false
  fixtures:
    description: "Path to custom fixtures file"
    required: false
  spec_path:
    description: "Path to OpenAPI specification. Pass `openapi_version` OR `spec_path` OR neither, never both"
    required: false
  openapi_version:
    description: "Use the OpenAPI specification at a specific version. Pass `openapi_version` OR `spec_path` OR neither, never both"
    required: false

runs:
  using: "composite"
  steps:
    - name: Start stripe-mock
      shell: bash
      run: |
        BETA_ARG=""
        FIXTURES_ARG=""
        SPEC_PATH_ARG=""
        CURL_OPTS=(--retry 3 \
            --retry-all-errors \
            --fail \
            --verbose \
            --no-progress-meter \
            --show-error)

        CURRENT_OPENAPI_SPEC=""
        CURRENT_FIXTURES_JSON=""

        SPEC_NAME="spec3.sdk.json"
        FIXTURES_NAME="fixtures3.json"

        if [ "${INPUTS_BETA}" == "true" ] || [ "${{ contains(inputs.base, 'b') }}" == "true" ]; then
          echo "Running stripe-mock with beta flag"
          BETA_ARG="-beta"
          SPEC_NAME="spec3.beta.sdk.json"
          FIXTURES_NAME="fixtures3.beta.json"
        fi

        if [ -n "${INPUTS_OPENAPI_VERSION}" ]; then
          if [ -n "${INPUTS_SPEC_PATH}" ]; then
            echo "Error: Pass either an OpenAPI version or a spec path, not both"
            exit 1
          fi

          if ! [[ "${INPUTS_OPENAPI_VERSION}" =~ ^v[0-9]+$ ]]; then
            echo "Error: Invalid OpenAPI version format. It should be in the format 'v<number>', e.g., 'v1', 'v2', etc."
            exit 1
          fi

          CURRENT_OPENAPI_SPEC=$(pwd)/latest.json
          CURRENT_FIXTURES_JSON=${CURRENT_OPENAPI_SPEC%/*}/fixtures.json
          echo "Pulling specs for ${INPUTS_OPENAPI_VERSION}"
          curl "${CURL_OPTS[@]}" "https://raw.githubusercontent.com/stripe/openapi/${INPUTS_OPENAPI_VERSION}/openapi/$SPEC_NAME" -o "$CURRENT_OPENAPI_SPEC"
          curl "${CURL_OPTS[@]}" "https://raw.githubusercontent.com/stripe/openapi/${INPUTS_OPENAPI_VERSION}/openapi/$FIXTURES_NAME" -o "$CURRENT_FIXTURES_JSON"
        elif [ -n "${INPUTS_SPEC_PATH}" ]; then
          echo "Spec path provided, using spec at ${INPUTS_SPEC_PATH}"
          CURRENT_OPENAPI_SPEC="${INPUTS_SPEC_PATH}"
        fi

        if [ -n "${INPUTS_FIXTURES}" ]; then
          echo "Fixtures path provided, using fixtures at ${INPUTS_FIXTURES}"
          CURRENT_FIXTURES_JSON="${INPUTS_FIXTURES}"
        fi

        SPEC_PATH_ARG=${CURRENT_OPENAPI_SPEC:+-spec $CURRENT_OPENAPI_SPEC}
        FIXTURES_ARG=${CURRENT_FIXTURES_JSON:+-fixtures $CURRENT_FIXTURES_JSON}

        if [ "${{ runner.os }}" == "Windows" ]; then
          curl "${CURL_OPTS[@]}" -L "https://github.com/stripe/stripe-mock/releases/download/v${STRIPE_MOCK_VERSION}/stripe-mock_${STRIPE_MOCK_VERSION}_windows_amd64.zip" -o stripe-mock.zip
          echo "${STRIPE_MOCK_WINDOWS_SHA256}  stripe-mock.zip" | sha256sum -c -
          unzip stripe-mock.zip -d stripe-mock
          nohup ./stripe-mock/stripe-mock.exe -http-addr 127.0.0.1:12111 -https-addr 127.0.0.1:12112 $BETA_ARG $FIXTURES_ARG $SPEC_PATH_ARG > stripe-mock.log 2>&1 &
          sleep 5
          cat stripe-mock.log
        else
          STRIPE_MOCK_IMAGE="stripe/stripe-mock@${STRIPE_MOCK_IMAGE_DIGEST}"
          for i in 1 2 3 4 5; do
            if docker pull "$STRIPE_MOCK_IMAGE"; then
              break
            fi
            echo "docker pull failed (attempt $i/5), retrying in 5s..."
            sleep 5
            if [ $i -eq 5 ]; then
              echo "docker pull failed after 5 attempts"
              exit 1
            fi
          done

          docker run -d -p 12111-12112:12111-12112 \
            -v "${{ github.workspace }}:${{ github.workspace }}:ro" \
            "$STRIPE_MOCK_IMAGE" $BETA_ARG $FIXTURES_ARG $SPEC_PATH_ARG
          sleep 7
        fi

        if ! curl -s -o /dev/null http://127.0.0.1:12111; then
          echo "stripe-mock failed to start!"
          if [ "${{ runner.os }}" != "Windows" ]; then
            docker logs $(docker ps -lq)
          else
            cat stripe-mock.log
          fi
          exit 1
        fi
      env:
        # stripe-mock is pinned so CI only runs bytes we've verified. To upgrade,
        # update all three values together from the same stripe-mock release:
        # the version, the multi-arch image digest for that version's Docker tag,
        # and the SHA-256 of stripe-mock_<version>_windows_amd64.zip.
        STRIPE_MOCK_VERSION: "0.206.0"
        STRIPE_MOCK_IMAGE_DIGEST: "sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78"
        STRIPE_MOCK_WINDOWS_SHA256: "3ead9f1c24f8a60db6bf421d306c3c7e71d24393c0c769196fa6ccedbca93109"
        INPUTS_BETA: ${{ inputs.beta }}
        INPUTS_OPENAPI_VERSION: ${{ inputs.openapi_version }}
        INPUTS_SPEC_PATH: ${{ inputs.spec_path }}
        INPUTS_FIXTURES: ${{ inputs.fixtures }}
